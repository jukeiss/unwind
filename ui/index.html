<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unwind</title>
<meta name="unwind-token" content="__UNWIND_TOKEN__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f2027'/%3E%3Cpath d='M9 9v8a7 7 0 0 0 14 0V9' fill='none' stroke='%238b7cf6' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='9' r='2.4' fill='%238b7cf6'/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">
  <nav class="ribbon" aria-label="Ribbon">
    <button class="rb" data-pane="files" title="Files (⌘⇧E)"><svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg></button>
    <button class="rb" data-pane="search" title="Search (⌘⇧F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
    <div class="rb-sep"></div>
    <button class="rb" data-open="graph" title="Graph view (⌘G)"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="12" cy="17" r="2.6"/><circle cx="19" cy="15" r="1.6"/><path d="M8 8.2 10.8 15M16 7.6l-3 7.2M8.2 7l7.5-.8M14.5 16.5l3-1"/></svg></button>
    <button class="rb" data-open="trace" title="Trace money (⌘T)"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.3"/><circle cx="19" cy="6" r="2.3"/><circle cx="19" cy="18" r="2.3"/><path d="M7.2 11 16.8 6.8M7.2 13l9.6 4.2"/></svg></button>
    <button class="rb" data-open="lab" title="Forensics lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5.5 9.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7.5 15h9"/></svg></button>
    <button class="rb" data-open="binary" title="Binary workbench (⌘B)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8.5 9 6.5 12l2 3M15.5 9l2 3-2 3M13 8l-2 8"/></svg></button>
    <button class="rb" id="rb-ai" title="AI assistant (⌘J)"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></button>
    <div class="rb-grow"></div>
    <button class="rb" data-open="settings" title="Settings & agent"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </nav>

  <aside class="side left" id="left">
    <div class="pane" id="pane-files">
      <div class="pane-head">
        <span class="pane-title">Vault</span>
        <div class="pane-actions">
          <button class="ib" id="new-note" title="New note (⌘N)"><svg viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M12 12v6M9 15h6"/></svg></button>
          <button class="ib" id="new-folder" title="New folder"><svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M12 10.5v5M9.5 13h5"/></svg></button>
          <button class="ib" id="refresh-tree" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
        </div>
      </div>
      <div class="tree" id="tree" role="tree"></div>
    </div>
    <div class="pane" id="pane-search" hidden>
      <div class="pane-head"><span class="pane-title">Search</span></div>
      <div class="pane-body">
        <input class="inp" id="search-input" placeholder="Search notes, or #tag" autocomplete="off" spellcheck="false">
        <div class="search-results" id="search-results"></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="tabbar" id="tabbar" role="tablist">
      <button class="ib tog" id="toggle-left" title="Toggle left sidebar (⌘\)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <div class="tabs" id="tabs"></div>
      <button class="ib" id="new-tab" title="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="grow"></div>
      <button class="ib tog" id="toggle-right" title="Toggle right sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div>
    <div class="views" id="views"></div>
  </main>

  <aside class="side right" id="right">
    <div class="right-body" id="right-body"></div>
  </aside>

  <footer class="status" id="status">
    <span id="st-left"></span>
    <span class="grow"></span>
    <span id="st-right"></span>
  </footer>
</div>

<div class="palette-wrap" id="palette" hidden>
  <div class="palette" role="dialog" aria-label="Command palette">
    <input class="palette-input" id="palette-input" placeholder="Type a command, note, address or transaction…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="palette-list" role="listbox"></div>
    <div class="palette-foot"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tooltip" hidden></div>
<div class="menu" id="menu" hidden></div>

<script src="/md.js"></script>
<script src="/graph.js"></script>
<script src="/app.js"></script>
<script src="/ai.js"></script>
<script src="/extra.js"></script>
<script src="/connect.js"></script>
</body>
</html>
